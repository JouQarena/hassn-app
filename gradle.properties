# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true

# Only keep R class entries that belong to this module (smaller APK, faster builds).
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "intellij".
kotlin.code.style=official

# Enables namespacing of each library's R class so that R classes are only unique
# in the first-party package (app module), reducing resource size.
android.nonFinalResIds=true
